name: Database backup and restore test

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BACKUP_DIR: backups
  BACKUP_RETENTION_DAYS: "30"

jobs:
  backup-and-restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production database backup
        run: pnpm db:backup
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_RETENTION_DAYS: ${{ env.BACKUP_RETENTION_DAYS }}

      - name: Restore backup into staging and verify recovery
        run: |
          BACKUP_FILE="$(ls -1t backups/*.dump | head -n 1)"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          export BACKUP_FILE
          pnpm db:restore:test
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: |
            backups/*.dump
            backups/*.dump.manifest.json
          retention-days: 30

      - name: Upload restore report metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-test-metadata-${{ github.run_id }}
          path: |
            backups/*.manifest.json
          retention-days: 30
